name: Apply briefing narration visual
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-briefing-visual.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Polish briefing narration presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('voice-system.js')
          s=p.read_text(encoding='utf-8')
          target="    if(!root.document||!req?.caption)return;"
          if "if(req?.team==='narrator')return;" not in s:
              if target not in s:
                  raise SystemExit('caption line not found')
              s=s.replace(target,"    if(req?.team==='narrator')return;\n"+target,1)
          p.write_text(s,encoding='utf-8')
          PY
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts['test:visual:update']='playwright test -c playwright.config.cjs --update-snapshots';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Install dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Build visual test site
        run: npm run build
      - name: Update intentional visual baseline
        run: npm run test:visual:update
      - name: Verify production build
        run: npm run test:build
      - name: Commit focused visual update
        shell: bash
        run: |
          rm .github/workflows/apply-briefing-visual.yml
          git config user.name "Angsthase"
          git config user.email "mikieburrow@gmail.com"
          git add voice-system.js package.json tests/visual/scenes.spec.cjs-snapshots .github/workflows/apply-briefing-visual.yml
          git commit -m "Polish narrated briefing presentation"
          git push origin HEAD:main
