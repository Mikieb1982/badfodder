name: Apply squad subgroup upgrade
on:
  push:
    branches:
      - assistant-squad-selection
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: assistant-squad-selection
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply focused subgroup changes
        run: python3 tools/runtime/apply-squad-selection.py
      - run: npm ci --ignore-scripts
      - run: npm run check:runtime
      - run: npm test
      - name: Commit subgroup implementation
        shell: bash
        run: |
          rm .github/workflows/apply-squad-selection.yml
          rm tools/runtime/apply-squad-selection.py
          git config user.name "Angsthase"
          git config user.email "mikieburrow@gmail.com"
          git add -A
          git commit -m "Enable flexible squad subgroup selection"
          git push origin HEAD:assistant-squad-selection
