name: Apply voice audio gate
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-voice-audio-gate.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Skip unavailable recorded voice files without network 404s
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('voice-system.js')
          s=p.read_text(encoding='utf-8')
          old="""  function playRecorded(req){
              if(!root.Audio||!req.url||missing.has(req.url)){speakTts(req);return}
          """.replace('      ','')
          new="""  function playRecorded(req){
              const available=root.BadFodderAvailableAudio;
              if(Array.isArray(available)&&req.url&&req.url.startsWith(BASE+'/')&&!available.includes(req.url)){speakTts(req);return}
              if(!root.Audio||!req.url||missing.has(req.url)){speakTts(req);return}
          """.replace('      ','')
          if old not in s:
              raise SystemExit('voice playRecorded anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify voice and production build
        run: |
          node tests/voice-system.cjs
          npm run test:build
      - name: Commit focused fix
        shell: bash
        run: |
          rm .github/workflows/apply-voice-audio-gate.yml
          git config user.name "Angsthase"
          git config user.email "mikieburrow@gmail.com"
          git add voice-system.js .github/workflows/apply-voice-audio-gate.yml
          git commit -m "Avoid missing voice asset requests"
          git push origin HEAD:main
