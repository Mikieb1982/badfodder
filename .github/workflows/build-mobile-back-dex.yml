name: Build mobile back-handler dex

on:
  push:
    paths:
      - '.github/workflows/build-mobile-back-dex.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile native back handler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/backdex/src/games/shootrabbits/mobile /tmp/backdex/src/com/getcapacitor /tmp/backdex/src/android/webkit /tmp/backdex/classes /tmp/backdex/out
          cat > /tmp/backdex/src/android/webkit/ValueCallback.java <<'JAVA'
          package android.webkit;
          public interface ValueCallback<T> { void onReceiveValue(T value); }
          JAVA
          cat > /tmp/backdex/src/android/webkit/WebView.java <<'JAVA'
          package android.webkit;
          public class WebView {
            public void evaluateJavascript(String script, ValueCallback<String> callback) {}
          }
          JAVA
          cat > /tmp/backdex/src/com/getcapacitor/Bridge.java <<'JAVA'
          package com.getcapacitor;
          public class Bridge {
            public android.webkit.WebView getWebView() { return null; }
          }
          JAVA
          cat > /tmp/backdex/src/com/getcapacitor/BridgeActivity.java <<'JAVA'
          package com.getcapacitor;
          public class BridgeActivity {
            protected Bridge bridge;
            public BridgeActivity() {}
            public void onBackPressed() {}
          }
          JAVA
          cat > /tmp/backdex/src/games/shootrabbits/mobile/MainActivity.java <<'JAVA'
          package games.shootrabbits.mobile;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            public MainActivity() { super(); }
            @Override public void onBackPressed() {
              if (bridge != null && bridge.getWebView() != null) {
                bridge.getWebView().evaluateJavascript("window.dispatchEvent(new Event('badfodder-android-back'));", null);
                return;
              }
              super.onBackPressed();
            }
          }
          JAVA
          javac -source 8 -target 8 -d /tmp/backdex/classes $(find /tmp/backdex/src -name '*.java')
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/d8" --min-api 24 --output /tmp/backdex/out /tmp/backdex/classes/games/shootrabbits/mobile/MainActivity.class
          test -s /tmp/backdex/out/classes.dex
          cp /tmp/backdex/out/classes.dex ./MainActivity-back-handler.dex
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-back-handler-dex
          path: MainActivity-back-handler.dex
          if-no-files-found: error
