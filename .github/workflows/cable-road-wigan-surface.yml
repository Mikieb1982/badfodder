name: Apply Wigan road surface to Cable Street

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-road:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Cable Street road material to Wigan
        env:
          ROAD_BLOCK: 
          SURFACE_BLOCK: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p=Path('cable-street-art.js')
          s=p.read_text()
          road=base64.b64decode(os.environ['ROAD_BLOCK']).decode()
          surface=base64.b64decode(os.environ['SURFACE_BLOCK']).decode()
          a=s.index('  function drawRoad(ctx,r,S){')
          b=s.index('\n\n  // Facade coordinates',a)
          s=s[:a]+road+s[b:]
          a=s.index('  function drawStreetSurface(ctx,map,S,art,bounds=null){')
          b=s.index('\n  function drawStreetProps',a)
          s=s[:a]+surface+s[b:]
          p.write_text(s)
          PY
      - name: Run Cable Street art tests
        run: node tests/cable-street-art.cjs && node tests/cable-street-foundation.cjs
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cable-street-art.js
          git commit -m "Match Cable Street road surface to Wigan"
          git push origin HEAD:main
