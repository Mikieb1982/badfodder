name: Cross-browser game checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/browser-lifecycle.cjs'
      - 'package-lock.json'
      - '.github/workflows/cross-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * 1'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/browser-lifecycle.cjs'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:browser
        env:
          BADFODDER_BROWSER: ${{ matrix.browser }}
          BADFODDER_TEST_DIST: '1'
