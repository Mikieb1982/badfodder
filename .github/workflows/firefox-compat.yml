name: Firefox Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm ci --ignore-scripts
      - name: Install Firefox
        run: npx --no-install playwright install --with-deps firefox
      - run: npm run build
      - name: Exercise Firefox mission lifecycle and touch controls
        run: npm run test:browser -- --project=firefox
        env:
          BADFODDER_TEST_DIST: '1'
      - name: Retain failed Firefox evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-firefox
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
