name: Import Barcelona character reference

on:
  push:
    branches: [chatgpt-import-barcelona-reference]

permissions:
  contents: write

jobs:
  import-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-import-barcelona-reference
          fetch-depth: 0

      - name: Rebuild and validate reference image
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/barcelona-reference/part*.b64 > /tmp/barcelona.b64
          base64 -d /tmp/barcelona.b64 > /tmp/barcelona.png
          test "$(stat -c%s /tmp/barcelona.png)" -eq 664459
          file /tmp/barcelona.png | grep -q 'PNG image data, 1024 x 572'

      - name: Commit image to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p assets/characters
          cp /tmp/barcelona.png assets/characters/barcelona.png
          rm -f assets/characters/barcelona.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/barcelona.png assets/characters/barcelona.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Add full Barcelona character reference guide'
          git push origin HEAD:main
