name: Import CC0 mission ambience
on:
  workflow_dispatch:
  push:
    branches: [chatgpt-import-mission-ambience]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 tools/audio/import-ambience.py
      - name: Save processed samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ambience
          git diff --cached --quiet && exit 0
          git commit -m 'Import and mix credited CC0 mission ambience'
          git push origin HEAD:${{ github.ref_name }}
