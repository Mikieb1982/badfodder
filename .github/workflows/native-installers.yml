name: Build native game installers
on:
  workflow_dispatch:
  push:
    branches: ["installers/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:runtime
      - run: npm run test:player-improvements
      - run: npm run test:coop
      - run: npm run test:offline
      - run: npm run test:build
      - run: node tests/chromebook-launch.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/player-improvements-browser.cjs
      - run: node tests/checkpoints-browser.cjs
      - run: npm run test:offline:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-improvements-browser-evidence
          path: test-results/
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: mac
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm run desktop:prepare
      - run: npm run test:desktop
      - run: npm install --prefix desktop
      - run: npm run package:${{ matrix.target }} --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Shoot-Rabbits-${{ matrix.target }}-installer
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
  android:
    needs: checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - run: npm run mobile:prepare
      - run: npm install --prefix mobile
      - run: npm run android --prefix mobile
      - run: npm run test:native
      # A debug-signed APK is directly installable for testing. Store releases
      # must use the owner's persistent Android signing key instead.
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Shoot-Rabbits-Android-test-installer
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    needs: checks
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm run mobile:prepare
      - run: npm install --prefix mobile
      - run: npm run ios --prefix mobile
      - run: npm run test:native
      # This validates device compilation. Distribution needs the owner's
      # Apple team, signing certificate and provisioning profile.
      - run: >-
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath release/Shoot-Rabbits-unsigned.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: Shoot-Rabbits-iOS-unsigned-archive-NOT-INSTALLABLE
          if-no-files-found: error
          path: release/Shoot-Rabbits-unsigned.xcarchive
