name: Patch Cable Street surface texture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cable-street-texture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Apply focused Cable Street texture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cable-street-art.js')
          text = path.read_text()

          anchor = "  function drawStreetSurface(ctx,map,S,art,bounds=null){\n"
          if anchor not in text:
              raise SystemExit('drawStreetSurface anchor not found')

          helper = r'''  let streetTextureTile=null;
  function getStreetTextureTile(){
    if(streetTextureTile)return streetTextureTile;
    let canvas=null;
    if(typeof OffscreenCanvas!=='undefined')canvas=new OffscreenCanvas(256,256);
    else if(typeof document!=='undefined'&&document.createElement){canvas=document.createElement('canvas');canvas.width=256;canvas.height=256}
    if(!canvas)return null;
    const t=canvas.getContext('2d');if(!t)return null;
    const seed=hashText('cable-street-surface');
    for(let i=0;i<180;i++){
      const x=seededUnit(seed,i*4+1)*256,y=seededUnit(seed,i*4+2)*256,r=.35+seededUnit(seed,i*4+3)*1.2;
      t.fillStyle=i%3===0?'rgba(31,33,31,.035)':'rgba(218,218,207,.018)';
      t.fillRect(x,y,r,r);
    }
    if(typeof t.createRadialGradient==='function')for(let i=0;i<7;i++){
      const x=seededUnit(seed,900+i*3)*256,y=seededUnit(seed,901+i*3)*256,rx=24+seededUnit(seed,902+i*3)*36;
      const g=t.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'rgba(30,32,30,.035)');g.addColorStop(1,'rgba(30,32,30,0)');
      t.fillStyle=g;t.fillRect(x-rx,y-rx,rx*2,rx*2);
    }
    streetTextureTile=canvas;return canvas;
  }
  function drawStreetTexture(ctx,pts,x,y,w,h,S,seed){
    if(!ctx||typeof ctx.clip!=='function')return;
    ctx.save();polygon(ctx,pts,null);ctx.clip();
    const tile=getStreetTextureTile();
    if(tile&&typeof ctx.createPattern==='function'){
      const pattern=ctx.createPattern(tile,'repeat');
      if(pattern){ctx.globalAlpha=.42;ctx.fillStyle=pattern;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1}
    }
    if(typeof ctx.createRadialGradient==='function')for(let i=0;i<3;i++){
      const px=x+w*(.2+seededUnit(seed,30+i*3)*.6),py=y+h*(.2+seededUnit(seed,31+i*3)*.6),r=Math.max(S(18),Math.min(w,h)*(.12+seededUnit(seed,32+i*3)*.08));
      const g=ctx.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(35,37,34,.035)');g.addColorStop(1,'rgba(35,37,34,0)');
      ctx.fillStyle=g;ctx.fillRect(px-r,py-r,r*2,r*2);
    }
    if(w>S(90)&&h>S(30)){
      const cx=x+w*(.28+seededUnit(seed,70)*.38),cy=y+h*(.3+seededUnit(seed,71)*.35),len=Math.min(S(22),w*.08);
      line(ctx,cx-len*.5,cy,cx-len*.08,cy+S(1.6),'rgba(45,47,43,.055)',Math.max(.35,S(.32)));
      line(ctx,cx-len*.08,cy+S(1.6),cx+len*.5,cy-S(.7),'rgba(45,47,43,.045)',Math.max(.3,S(.28)));
    }
    polygon(ctx,pts,null,'rgba(43,45,42,.08)',Math.max(S(2.2),1));
    ctx.restore();
  }
'''

          if 'function getStreetTextureTile()' not in text:
              text = text.replace(anchor, helper + anchor, 1)

          old = r'''      const asphalt=art&&typeof art.texture==='function'?art.texture(ctx,'urban-asphalt'):'#696b61';
      const paving=art&&typeof art.texture==='function'?art.texture(ctx,'urban-paving'):'#8b8779';
      // Match Wigan's road material stack: dark kerb edge, paving strip, then the shared asphalt texture.
      ctx.save();
      polygon(ctx,pts,asphalt,'#777969',S(2.5));
      polygon(ctx,pts,null,paving,S(1.5));
      ctx.restore();'''
          new = r'''      const asphalt=art&&typeof art.texture==='function'?art.texture(ctx,'urban-asphalt'):'#696b61';
      const paving=art&&typeof art.texture==='function'?art.texture(ctx,'urban-paving'):'#8b8779';
      // Keep the established grey road material, then add only a low-contrast handcrafted surface pass.
      ctx.save();
      polygon(ctx,pts,asphalt,'#777969',S(2.5));
      drawStreetTexture(ctx,pts,x,y,w,h,S,hashText(raw.map(p=>p.join(',')).join('|')));
      polygon(ctx,pts,null,paving,S(1.5));
      ctx.restore();'''
          if old not in text:
              raise SystemExit('expected street surface block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm .github/workflows/patch-cable-street-texture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cable-street-art.js .github/workflows/patch-cable-street-texture.yml
          git diff --cached --check
          git commit -m "Improve Cable Street street surface texture"
          git push origin HEAD:main
