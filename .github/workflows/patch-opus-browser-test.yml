name: Patch Opus browser assertions

on:
  push:
    branches: [fix/opus-ci-delivery]
    paths:
      - .github/workflows/patch-opus-browser-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Accept negotiated WebM or MP3 music in lifecycle tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-lifecycle.cjs')
          text=p.read_text()
          old_home="assert((await page.evaluate(()=>BadFodderMusic.source)).endsWith('assets/audio/bad_fodder.mp3'));"
          new_home="assert(/assets\\/audio\\/bad_fodder\\.(?:webm|mp3)$/.test(await page.evaluate(()=>BadFodderMusic.source)));"
          old_cable="assert((await page.evaluate(()=>BadFodderMusic.source)).endsWith('assets/audio/cable_street.mp3'));"
          new_cable="assert(/assets\\/audio\\/cable_street\\.(?:webm|mp3)$/.test(await page.evaluate(()=>BadFodderMusic.source)));"
          if old_home not in text or old_cable not in text:
              raise SystemExit('Expected legacy MP3 lifecycle assertions not found')
          text=text.replace(old_home,new_home).replace(old_cable,new_cable)
          p.write_text(text)
          PY
      - name: Commit patch to feature branch
        run: |
          rm .github/workflows/patch-opus-browser-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accept negotiated music formats in browser lifecycle"
          git pull --rebase origin fix/opus-ci-delivery
          git push origin HEAD:fix/opus-ci-delivery
