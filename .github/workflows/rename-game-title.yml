name: Rename game title

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old display name everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = (
              ("Bad" + " Fodder", "If I Can Shoot Rabbits"),
              ("BAD" + " FODDER", "IF I CAN SHOOT RABBITS"),
          )

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Renamed title in {len(changed)} files')
          for path in changed:
              print(path)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/rename-game-title.yml
      - name: Commit replacement
        run: |
          if git diff --quiet; then
            echo "No title replacements were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename game to If I Can Shoot Rabbits"
          git push origin HEAD:main
