name: Review painted enemy artwork
on:
  push:
    branches: [chatgpt-enemy-art-polish]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chatgpt-enemy-art-polish
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run test:build
      - run: node tests/enemy-art.cjs
      - name: Refresh intended enemy visual baselines
        run: npm run test:visual:update
      - name: Check resulting screenshots
        run: npm run test:visual
      - name: Save reviewed baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/scenes.spec.cjs-snapshots
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh visual baselines for painted enemy artwork'
          git push origin HEAD:chatgpt-enemy-art-polish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enemy-art-review
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
