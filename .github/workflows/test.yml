name: Test If I Can Shoot Rabbits

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run regression suite
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runner
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise mission lifecycle and touch controls
        run: npm run test:browser
      - name: Exercise two-browser co-op experience
        env:
          BADFODDER_COOP_MOCK_RTC: '1'
        run: npm run test:coop:browser
